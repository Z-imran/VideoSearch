services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: videosearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: videosearch
    volumes:
      - videosearch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videosearch -d videosearch"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backend/db/migrations:/migrations:ro
    command:
      - sh
      - -c
      - for migration in /migrations/*.sql; do psql -h postgres -U videosearch -d videosearch -v ON_ERROR_STOP=1 -f "$$migration"; done
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://videosearch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/videosearch
      STORAGE_DIR: /app/storage
      UPLOADS_ENABLED: ${UPLOADS_ENABLED:-true}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      S3_PRESIGNED_URL_SECONDS: ${S3_PRESIGNED_URL_SECONDS:-300}
    volumes:
      - videosearch_media:/app/storage

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  videosearch_pgdata:
  videosearch_media:
  caddy_data:
  caddy_config:
