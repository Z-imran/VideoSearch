services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: videosearch-postgres
    environment:
      POSTGRES_USER: videosearch
      POSTGRES_PASSWORD: videosearch
      POSTGRES_DB: videosearch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - videosearch_pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videosearch -d videosearch"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  api:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: videosearch-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://videosearch:videosearch@postgres:5432/videosearch

volumes:
  videosearch_pgdata: